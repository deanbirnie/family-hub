# Opens pull requests for dependency updates, so they arrive without anyone
# having to look. Each one still goes through CI and review like any other
# change: see docs/MAINTENANCE.md for what to check before merging.
#
# Security fixes are proposed as soon as they are published (enable
# "Dependabot security updates" in the repository settings); everything else
# is collected into a few grouped pull requests a week.
version: 2
updates:
  # The whole npm workspace (web, mobile, shared interface) has one lockfile.
  # The server has no npm dependencies.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Capacitor's packages move together, and its majors need the native
      # project migrated (npx cap migrate): reviewed on their own.
      capacitor:
        patterns: ['@capacitor/*']
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ['@capacitor/*']
    ignore:
      # Held at 24.x on purpose: the types must match the Node 24 the server
      # and CI run on. Move it together with Node itself.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  # The pinned GitHub Actions (by commit, with the version in a comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # The Android app's own libraries and build tools.
  - package-ecosystem: gradle
    directory: /apps/mobile/android
    schedule:
      interval: weekly
    groups:
      android:
        update-types: [minor, patch]
    ignore:
      # A new Gradle or Android Gradle plugin major has to be supported by
      # Capacitor first: upgrade it on purpose, with a test build.
      - dependency-name: gradle-wrapper
        update-types: [version-update:semver-major]
      - dependency-name: com.android.tools.build:gradle
        update-types: [version-update:semver-major]

  # The image's base (node:24-alpine).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on Node 24 until the server is moved to a newer LTS on purpose.
      - dependency-name: node
        update-types: [version-update:semver-major]
